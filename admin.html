<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitor Cosméticos | Área Administrativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/admin.css" rel="stylesheet" /> </head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Vitor Cosméticos</a>
            <nav>
                <a href="index.html" class="btn btn-outline-primary">Voltar para a Loja</a>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <div class="container admin-container">
            <h1 id="admin-title">Login Administrativo</h1>
            
            <form id="login-form" class="admin-form">
                <div class="form-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p id="login-error" class="error-message"></p>
            </form>

            <div id="admin-dashboard" class="admin-dashboard" style="display: none;">
                <h2>Painel de Administração</h2>
                
                <section class="dashboard-section">
                    <h3>Acompanhamento de Vendas</h3>
                    <div id="sales-data">
                        <p>Total de Vendas: <span id="total-sales">R$ 0,00</span></p>
                        <p>Últimos Pedidos:</p>
                        <ul id="latest-orders">
                            <li>Nenhum pedido recente.</li>
                        </ul>
                    </div>
                </section>

                <section class="dashboard-section">
                    <h3>Gestão de Estoque</h3>
                    <ul id="stock-list">
                        <li>Carregando estoque...</li>
                    </ul>
                    <button class="btn btn-secondary" id="refresh-stock-btn">Atualizar Estoque</button>
                </section>

                <section class="dashboard-section">
                    <h3>Cadastrar Novo Produto</h3>
                    <form id="add-product-form" class="admin-form">
                        <div class="form-group">
                            <label for="new-product-name">Nome do Produto:</label>
                            <input type="text" id="new-product-name" required>
                        </div>
                        <div class="form-group">
                            <label for="new-product-price">Preço:</label>
                            <input type="number" id="new-product-price" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="new-product-category">Categoria:</label>
                            <input type="text" id="new-product-category" required>
                        </div>
                        <div class="form-group">
                            <label for="new-product-stock">Estoque:</label>
                            <input type="number" id="new-product-stock" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Adicionar Produto</button>
                        <p id="add-product-message" class="success-message"></p>
                    </form>
                </section>

                <button class="btn btn-outline-primary" id="logout-btn">Sair</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Vitor Cosméticos. Área Administrativa.</p>
        </div>
    </footer>

    <script src="js/admin-script.js"></script> </body>
</html>
